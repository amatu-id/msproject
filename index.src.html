<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<script src="/amatu.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amatu Project — Jadwal Proyek, Gantt & Sumber Daya</title>
<meta name="description" content="Amatu Project — perencanaan proyek gaya Microsoft Project di browser: Bagan Gantt, jalur kritis, tautan & lag, kalender kerja, sumber daya, pemerataan, garis dasar, nilai hasil, laporan, cetak/PDF dan ekspor Excel/Microsoft Project XML.">
<meta name="versi" content="%%VERSI%%">
<meta name="theme-color" content="#f3f5f7">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0&display=block">
<link rel="stylesheet" href="app.css?v=%%VERSI%%">
</head>
<body class="booting">
<div id="home" hidden></div>
<div id="app" hidden>
  <header id="titlebar">
    <button id="app-logo" class="tb-logo" type="button" data-tip="Beranda (daftar proyek)" aria-label="Beranda"><img src="icon.svg" alt="" width="26" height="26"></button>
    <div class="qat">
      <span id="save-state" class="save-state" data-st="saved"></span>
      <button id="qat-save" class="icon-btn sm" type="button" data-tip="Simpan|Ctrl+S" aria-label="Simpan"><span class="ms">save</span></button>
      <button id="qat-undo" class="icon-btn sm" type="button" data-tip="Batalkan" aria-label="Batalkan"><span class="ms">undo</span></button>
      <button id="qat-redo" class="icon-btn sm" type="button" data-tip="Ulangi" aria-label="Ulangi"><span class="ms">redo</span></button>
      <button id="qat-print" class="icon-btn sm" type="button" data-tip="Cetak / PDF|Ctrl+P" aria-label="Cetak"><span class="ms">print</span></button>
    </div>
    <input id="doc-title" class="doc-title" spellcheck="false" aria-label="Nama proyek" value="">
    <div class="tellme"><span class="ms">lightbulb</span><input id="tellme" type="search" placeholder="Beri tahu saya apa yang ingin Anda lakukan" aria-label="Cari perintah"></div>
  </header>
  <nav id="ribbon-tabs" class="rtabs" role="tablist"></nav>
  <button id="ribbon-collapse" class="icon-btn xs rcoll" type="button" data-tip="Ciutkan / tampilkan ribbon|Ctrl+F1" aria-label="Ciutkan ribbon"><span class="ms">expand_less</span></button>
  <div id="ribbon" class="ribbon"></div>
  <div id="tlpane" class="tlpane" hidden></div>
  <main id="main">
    <div id="primary"></div>
    <div id="hsplit" class="hbar" hidden role="separator" aria-orientation="horizontal"></div>
    <div id="detail" class="detail" hidden></div>
  </main>
  <footer id="statusbar" class="statusbar"></footer>
</div>
<script src="js/util.js?v=%%VERSI%%"></script>
<script src="js/cal.js?v=%%VERSI%%"></script>
<script src="js/dur.js?v=%%VERSI%%"></script>
<script src="js/model.js?v=%%VERSI%%"></script>
<script src="js/sched.js?v=%%VERSI%%"></script>
<script src="js/fields.js?v=%%VERSI%%"></script>
<script src="js/fx.js?v=%%VERSI%%"></script>
<script src="js/ts.js?v=%%VERSI%%"></script>
<script src="js/ui.js?v=%%VERSI%%"></script>
<script src="js/store.js?v=%%VERSI%%"></script>
<script src="js/grid.js?v=%%VERSI%%"></script>
<script src="js/gantt.js?v=%%VERSI%%"></script>
<script src="js/views.js?v=%%VERSI%%"></script>
<script src="js/pages.js?v=%%VERSI%%"></script>
<script src="js/views2.js?v=%%VERSI%%"></script>
<script src="js/reports.js?v=%%VERSI%%"></script>
<script src="js/tpl.js?v=%%VERSI%%"></script>
<script src="js/dialogs.js?v=%%VERSI%%"></script>
<script src="js/dialogs2.js?v=%%VERSI%%"></script>
<script src="js/print.js?v=%%VERSI%%"></script>
<script src="js/io.js?v=%%VERSI%%"></script>
<script src="js/lock.js?v=%%VERSI%%"></script>
<script src="js/home.js?v=%%VERSI%%"></script>
<script src="js/ribbon.js?v=%%VERSI%%"></script>
<script src="js/app.js?v=%%VERSI%%"></script>
</body>
</html>
